# Uso: docker compose -f pruebas/compose-carga.yml up -d --build   (API de prueba en http://localhost:18080, base aparte)
# Al terminar: docker compose -f pruebas/compose-carga.yml down -v
# Perfil "producción gratuita": mismos límites que Render (0.1 CPU, 512 MB), Render Key Value free
# (50 conexiones, 25 MB) y el pool de 10 conexiones que usa la API contra Supabase.
name: cineight-carga
services:
  postgres:
    image: postgres:18-alpine
    environment: { POSTGRES_DB: cineight, POSTGRES_USER: cineight, POSTGRES_PASSWORD: cineight }
    volumes:
      - "../db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro"
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cineight"], interval: 3s, retries: 30 }
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--notify-keyspace-events", "Ex", "--maxclients", "50", "--maxmemory", "25mb", "--maxmemory-policy", "noeviction"]
  api:
    image: cineight-api-carga
    build: ../backend
    environment:
      DATABASE_URL: postgres://cineight:cineight@postgres:5432/cineight
      REDIS_URL: redis://redis:6379/0
      DB_MAX_CONNS: "10"
      DB_MIN_CONNS: "2"
      TRUST_PROXY: "true"
      CORS_ORIGINS: http://localhost:3100
      RECAPTCHA_SECRET: ""
      COLA_CAPACIDAD: "5"
    ports: ["18080:8080"]
    deploy: { resources: { limits: { cpus: "0.10", memory: 512M } } }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
